# ========================================
# Maguru - AI Coding Learning Platform
# Conda Environment Configuration (Enterprise Ready)
# ========================================
#
# Usage:
#   conda env create -f environment.yml
#   conda activate maguru
#

name: maguru

channels:
  - conda-forge
  - defaults

dependencies:
  # Python Runtime
  - python=3.10

  # Utilities available via Conda
  - pyyaml>=6.0.1
  - requests>=2.31.0
  - python-dotenv>=1.0.0
  - pip>=23.0

  # Pip dependencies (LangChain, LangGraph, FastAPI & Modern Vector DB)
  - pip:
      - fastapi>=0.110.0
      - uvicorn[standard]>=0.27.0
      - sse-starlette>=1.6.0
      - python-multipart>=0.0.9
      - langchain>=0.2.0
      - langchain-core>=0.2.0
      - langchain-community>=0.2.0
      - langchain-openai>=0.1.0
      - langserve[all]>=0.3.0
      - langgraph>=0.2.20
      - langgraph-checkpoint>=2.0.0
      - langgraph-checkpoint-postgres>=2.0.0
      - langchain-postgres>=0.0.12
      - pgvector>=0.2.5
      - psycopg2-binary>=2.9.9
      - psycopg[binary,pool]>=3.1.18
      - openai>=1.35.0
      - pypdf>=4.0.0
      - tiktoken>=0.7.0
      - pydantic>=2.0.0
      - pydantic-settings>=2.0.0
      - pytest>=7.4.0
      - pytest-cov>=4.1.0
